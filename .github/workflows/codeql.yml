name: CodeQL

on:
  push:
    branches: [main, codex-engine-review]
  pull_request:
  schedule:
    # Weekly scheduled scan catches newly-disclosed query patterns
    # even when the codebase itself hasn't changed.
    - cron: "23 4 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # Required by github/codeql-action to read the checked-out code
      # and to upload SARIF results to the repo's Security tab.
      # Nothing else is granted.
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
