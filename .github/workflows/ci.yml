name: CI

on:
  push:
    branches: [main, codex-engine-review]
  pull_request:

# Least-privilege default: this workflow only reads code and runs
# tests/lint. Nothing here needs to write to the repo, comment on PRs,
# or touch any other GitHub API surface.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Non-blocking: the repo currently has pre-existing flake8 E501
      # violations in a handful of test files (unrelated to this
      # workflow). Surfacing lint output without failing CI on day one
      # avoids gating merges on a pre-existing, unrelated cleanup.
      - name: Run flake8
        run: python -m flake8 .
        continue-on-error: true
